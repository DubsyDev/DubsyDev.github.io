<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Franklin Newman</title>
<style>
:root{--bg:#f8f8ff;--surface:#ffffff;--text:#0b0b14;--muted:#5b5f6b;--line:#e9e9f3;--shadow:0 2px 8px rgba(30,30,80,.10);--hover:#0b0b14;--hover-text:#ffffff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e16;--surface:#1a1a26;--text:#f4f4fa;--muted:#a0a3b1;--line:#292938;--shadow:0 2px 8px rgba(0,0,0,.4);--hover:#f4f4fa;--hover-text:#0e0e16;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0e16;--surface:#1a1a26;--text:#f4f4fa;--muted:#a0a3b1;--line:#292938;--shadow:0 2px 8px rgba(0,0,0,.4);--hover:#f4f4fa;--hover-text:#0e0e16;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px 24px;background:var(--bg);color:var(--text);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
main{flex:1;display:flex;flex-direction:column;align-items:center;width:100%}
.pfp{width:100px;height:100px;border-radius:50%;object-fit:cover;display:block}
h1{margin:22px 0 0;font-size:1.25rem;font-weight:600}
.handle{margin:6px 0 0;color:var(--muted);font-size:1.15rem}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:30px}
.links a{width:70px;height:70px;border-radius:16px;display:grid;place-items:center;background:var(--surface);color:var(--text);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .15s,background .15s,color .15s}
.links a:hover{background:var(--hover);color:var(--hover-text);transform:translateY(-3px)}
.links a:focus-visible{outline:3px solid var(--text);outline-offset:3px}
.links svg{width:30px;height:30px}
.fill{fill:currentColor}
.stroke{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
footer{margin-top:40px;color:var(--muted);font-size:.9rem;text-align:center}
@media (prefers-reduced-motion:reduce){.links a{transition:none}.links a:hover{transform:none}}
</style>
</head>
